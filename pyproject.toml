[project]
name = "langchain-mcp"
version = "0.1.0"
description = "LangChain + MCP practice notebooks"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "gradio>=5.0.0,<6.0.0",
    "pydantic>=2.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.uv]
package = false
